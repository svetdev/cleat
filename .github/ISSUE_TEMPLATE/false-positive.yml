name: A gate is wrong about something
description: A gate flagged code it should not have, or missed code it should have caught.
labels: ["gate"]
body:
  - type: dropdown
    id: gate
    attributes:
      label: Which gate
      options: [complexity, duplication, escapes, layering, reachability, changed-coverage, crap, public-api, doc-citations, doc-size, test-hygiene, guard-suites, manifests, inventory, sarif, hotspots]
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language and reader
      placeholder: "typescript, imports" or "swift, identifiers" or "rust, lizard"
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: The smallest code that reproduces it
      description: Ten lines is ideal. This becomes the test.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What the gate printed
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should have done
    validations:
      required: true
